name: Sync with upstream

on:
  schedule:
    # 每天北京时间 08:00 自动检查
    # 每 6 小时检查一次
    - cron: "0 6 * * *"

  # 允许手动运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync upstream
        run: |
          gh repo sync ${{ github.repository }} --branch main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
